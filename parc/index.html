<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaïna — Gestion du parc (version locale)</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--indigo:#1F232B;--nuit:#15171C;--safran:#B8975A;--sc:#EFE6D6;--sable:#F7F4EE;--encre:#1A1C21;--douce:#6B665E;--ligne:#E3DCCF;--alerte:#B3261E;--blanc:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:"DM Sans",Arial,sans-serif;color:var(--encre);background:var(--sable);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Crimson Text",Georgia,serif;font-weight:700;letter-spacing:-0.005em;color:var(--indigo);margin:0;line-height:1.15}
h1{font-size:28px}h2{font-size:17px}h3{font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--nuit);color:var(--sable);display:flex;flex-direction:column;padding:26px 16px;gap:2px}
.side .logo{width:132px;height:58px;margin:0 0 30px 6px}
.side a{color:rgba(245,239,230,.78);text-decoration:none;padding:11px 12px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-weight:500;letter-spacing:.01em;border-left:2px solid transparent}
.side a:hover{color:#fff;background:rgba(255,255,255,.04)}
.side a.on{color:#fff;border-left-color:var(--safran);background:rgba(255,255,255,.06);font-weight:700}
.side .badge{background:transparent;color:var(--safran);border:1px solid var(--safran);border-radius:10px;padding:0 7px;font-size:11px;font-weight:700}
.side .foot{margin-top:auto;font-size:11px;letter-spacing:.02em;color:rgba(245,239,230,.6);line-height:1.6;padding:0 6px}
.side .foot .btn{background:transparent;color:var(--sable);border-color:rgba(245,239,230,.3)}
.main{flex:1;min-width:0;padding:36px 44px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--ligne)}
.top .muted{margin-top:6px}
.muted{color:var(--douce)}
.eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--douce);margin-bottom:8px}
.banner{background:var(--sc);border-radius:4px;padding:11px 16px;font-size:13px}
.banner.err{background:#F6DCDA;color:var(--alerte)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0;background:#fff;border:1px solid var(--ligne);border-radius:4px}
.tiles .card{border:0;border-right:1px solid var(--ligne);border-radius:0;box-shadow:none}
.tiles .card:last-child{border-right:0}
.card{background:#fff;border:1px solid var(--ligne);border-radius:4px;padding:20px 22px;box-shadow:0 1px 0 rgba(21,23,28,.03)}
.card .muted.small:first-child{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.num{font-family:"Crimson Text",Georgia,serif;font-weight:700;font-size:34px;color:var(--indigo);letter-spacing:-0.01em;margin:6px 0 2px}
.num.red{color:var(--alerte)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--ligne);border-radius:4px}
table{border-collapse:collapse;width:100%}
th{background:#fff;color:var(--douce);text-align:left;padding:12px 14px;font-weight:700;white-space:nowrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--encre)}
td{padding:12px 14px;border-top:1px solid var(--ligne);vertical-align:top;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#FAF8F4}
.pill{display:inline-block;border-radius:3px;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.P1{background:var(--alerte);color:#fff}.P2{background:var(--safran);color:var(--encre)}.P3{background:transparent;color:var(--indigo);box-shadow:inset 0 0 0 1px #D8CFBF}
.ok{background:transparent;color:#1F5A33;box-shadow:inset 0 0 0 1px #B9D4C1}
.st-imm{background:transparent;color:var(--alerte);box-shadow:inset 0 0 0 1px #E7B9B5}
.btn{font:inherit;font-size:13px;border:1px solid var(--ligne);background:#fff;color:var(--encre);border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:500;letter-spacing:.01em}
.btn:hover{border-color:var(--indigo)}
.btn.pri{background:var(--safran);border-color:var(--safran);color:var(--encre);font-weight:700;box-shadow:0 8px 18px -12px rgba(21,23,28,.5)}
.btn.dark{background:var(--nuit);border-color:var(--nuit);color:#fff}
.btn.danger{color:var(--alerte);border-color:#E7B9B5}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;border:0;border-bottom:1px solid #C9C1B3;border-radius:0;padding:8px 2px;background:transparent;color:var(--encre)}
input:focus,select:focus,textarea:focus{outline:0;border-bottom:2px solid var(--indigo)}
textarea{border:1px solid var(--ligne);border-radius:4px;padding:10px}
.filters select,.filters input{min-width:160px}
.modal-bg{position:fixed;inset:0;background:rgba(21,23,28,.4);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;z-index:10}
.modal{background:#fff;border-radius:4px;max-width:640px;width:100%;padding:30px;display:flex;flex-direction:column;gap:18px;border-top:3px solid var(--safran);box-shadow:0 30px 60px -30px rgba(21,23,28,.5)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.form label{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--douce);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.form label input,.form label select{font-size:15px;letter-spacing:0;text-transform:none;font-weight:400}
.form .full{grid-column:1/-1}
.warnbox{background:#FBEDEC;border-left:2px solid var(--alerte);padding:12px 14px;color:var(--alerte);font-size:13px}
.list{display:flex;flex-direction:column;gap:0;background:#fff;border:1px solid var(--ligne);border-radius:4px}
.list .alert{border:0;border-bottom:1px solid var(--ligne);border-radius:0}
.list .alert:last-child{border-bottom:0}
.card .list{border:0}
.alert{background:#fff;border:1px solid var(--ligne);border-radius:4px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.alert .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.alert .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.small{font-size:12px}
.tel{font-variant-numeric:tabular-nums}
.empty{padding:36px;text-align:center;color:var(--douce)}
@media(max-width:760px){.app{flex-direction:column}.side{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px}.side .logo{width:96px;height:42px;margin:0 8px 0 0}.side a{border-left:0;border-bottom:2px solid transparent}.side a.on{border-bottom-color:var(--safran)}.side .foot{display:none}.main{padding:20px}.form{grid-template-columns:1fr}.tiles .card{border-right:0;border-bottom:1px solid var(--ligne)}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Menu">

15625C192.3125 41.7578125 195.28125 44.5703125 199.34375 44.5703125ZM233.4453125 67.578125C233.4453125 61.953125 236.1796875 59.3359375 240.4375 59.3359375C244.6953125 59.3359375 247.15625 61.9921875 247.15625 66.875V90.0H260.59375V64.0625C260.59375 53.90625 255.359375 47.8515625 246.4140625 47.8515625C240.203125 47.8515625 236.0234375 50.703125 233.2890625 55.4296875V48.75H220.0078125V90.0H233.4453125ZM278.2109375 90.703125C284.03125 90.703125 287.7421875 88.671875 290.203125 84.21875H290.359375V90.0H303.484375V62.2265625C303.484375 53.125 296.8828125 47.8515625 284.890625 47.8515625C272.9375 47.8515625 266.1796875 53.1640625 265.59375 62.109375H278.09375C278.3671875 59.296875 280.671875 57.5 284.421875 57.5C287.9765625 57.5 290.1640625 59.1796875 290.1640625 61.640625V61.8359375C290.1640625 64.296875 287.46875 64.8828125 280.0859375 65.5078125C271.296875 66.2109375 264.0703125 69.21875 264.0703125 78.4765625C264.0703125 86.6796875 269.96875 90.703125 278.2109375 90.703125ZM282.3125 81.9140625C279.03125 81.9140625 276.8046875 80.390625 276.8046875 77.8515625C276.8046875 75.15625 279.3828125 73.671875 282.9765625 73.125C286.296875 72.578125 288.8359375 72.0703125 290.28125 71.40625V75.15625C290.28125 79.21875 286.8046875 81.9140625 282.3125 81.9140625Z" fill="#F7F4EE"/></g></svg>
    <a href="#tableau-de-bord" data-v="tableau-de-bord">Tableau de bord</a>
    <a href="#vehicules" data-v="vehicules">Véhicules</a>
    <a href="#conducteurs" data-v="conducteurs">Conducteurs</a>

    <div class="foot">Version locale · données enregistrées dans ce navigateur<br><button class="btn sm" style="margin-top:8px" onclick="kainaExport()">Sauvegarder (.json)</button> <label class="btn sm" style="margin-top:8px;display:inline-block">Restaurer<input type="file" accept=".json" hidden onchange="kainaImport(this.files[0])"></label><br><br>Aucune immobilisation sans validation du chef de parc.</div>
  </nav>

</div>

<script>
(() => {
const REF = {'VP pré-vendeur':7,'VP direction':8,'VUL 3,5 t':11,'Camion 7,5 t':18};
const TYPES = Object.keys(REF);
const AGENCES = ['Casablanca','Rabat-Salé','Tanger','Fès','Marrakech','Agadir'];
const PRIX_GASOIL = 13.5;
const S = {veh:{}, drv:{}, dec:[], db:null, ready:{veh:false,drv:false}, error:null, writable:true, showTel:{}};
const $ = (s, r=document) => r.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const pd = (s) => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const fd = (s) => { const d = pd(s); return d ? d.toLocaleDateString('fr-FR') : '—'; };
const days = (s) => { const d = pd(s); return d ? Math.round((d - today()) / 864e5) : null; };
const nf = (n) => (n == null || n === '' || isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR');
const interval = (type) => type && type.startsWith('VP') ? 15000 : 10000;
const vehOf = (did) => Object.entries(S.veh).find(([, v]) => v.conducteurId === did);
const maskTel = (t) => t ? t.replace(/\d(?=(?:\D*\d){2})/g, (c, i) => i < 2 ? c : '•') : '—';

// ---------- Alert engine (règles de gestion v2) ----------
function computeAlerts() {
  const out = [];
  const T = today();
  for (const [vid, v] of Object.entries(S.veh)) {
    const tag = `${v.immat} · ${v.type} · ${v.agence}`;
    const enService = v.statut === 'En service';
    for (const [field, label] of [['finVT','Visite technique'],['finAssurance','Assurance']]) {
      const d = days(v[field]);
      if (d == null) { out.push({p:'P3', cat:'Véhicule', vid, agence:v.agence, titre:`${label} : date manquante`, detail:`${tag}. Donnée à vérifier.`}); continue; }
      if (d < 0 && enService) out.push({p:'P1', cat:'Véhicule', vid, agence:v.agence, titre:`${label} expirée depuis le ${fd(v[field])}`, detail:`${tag}. Véhicule en service : à régler le jour même.`, immob:true});
      else if (d >= 0 && d < 30) out.push({p:'P2', cat:'Véhicule', vid, agence:v.agence, titre:`${label} : fin le ${fd(v[field])} (dans ${d} j)`, detail:`${tag}. À renouveler sous 7 jours.`});
    }
    if (v.statut === 'Immobilisé' && Number(v.carbMois) > 0) out.push({p:'P1', cat:'Véhicule', vid, agence:v.agence, titre:`Carburant consommé par un véhicule immobilisé : ${nf(v.carbMois)} L`, detail:`${tag}. Aucune consommation attendue : vérifier la carte carburant le jour même.`});
    const km = Number(v.km), kv = Number(v.kmVidange);
    if (!isNaN(km) && !isNaN(kv)) {
      if (km < kv) out.push({p:'P3', cat:'Véhicule', vid, agence:v.agence, titre:`Donnée à vérifier : compteur (${nf(km)} km) inférieur à la dernière vidange (${nf(kv)} km)`, detail:`${tag}. Aucune alerte de vidange calculée tant que la donnée n'est pas corrigée.`});
      else {
        const since = km - kv, iv = interval(v.type), rest = iv - since;
        if (rest <= 0) out.push({p:'P2', cat:'Véhicule', vid, agence:v.agence, titre:`Vidange dépassée de ${nf(-rest)} km`, detail:`${tag}. ${nf(since)} km depuis la dernière vidange (seuil ${nf(iv)} km).`});
        else if (rest < 1000) out.push({p:'P3', cat:'Véhicule', vid, agence:v.agence, titre:`Vidange à faire dans ${nf(rest)} km`, detail:`${tag}. Seuil ${nf(iv)} km.`});
      }
    }
    const kmM = Number(v.kmMois), cM = Number(v.carbMois), ref = REF[v.type];
    if (enService && kmM > 0 && cM > 0 && ref) {
      const l100 = cM / kmM * 100;
      if (l100 > ref * 1.25) {
        const exces = cM - ref * kmM / 100;
        out.push({p:'P2', cat:'Véhicule', vid, agence:v.agence, titre:`Surconsommation : ${l100.toLocaleString('fr-FR',{maximumFractionDigits:1})} L/100 km (référence ${ref})`, detail:`${tag}. +${Math.round((l100/ref-1)*100)} % ; excès estimé ${nf(Math.round(exces))} L, soit ${nf(Math.round(exces*PRIX_GASOIL))} MAD. Vérifier fuite, carte carburant, itinéraire. Aucune sanction automatique.`});
      }
    }
    if (!v.conducteurId) {
      const dispo = Object.entries(S.drv).filter(([did, d]) => d.agence === v.agence && d.statut !== 'Congé' && !vehOf(did) && permisOk(d.permis, v.type)).map(([, d]) => d.nom);
      out.push({p:'P3', cat:'Véhicule', vid, agence:v.agence, titre:'Véhicule non affecté', detail:`${tag}. À signaler au chef d'agence.${dispo.length ? ' Conducteur(s) disponible(s) : ' + dispo.join(', ') + '.' : ''}`});
    }
  }
  for (const [did, d] of Object.entries(S.drv)) {
    const vv = vehOf(did); const v = vv && vv[1];
    const tag = `${d.nom} · ${d.agence}`;
    const dp = days(d.finPermis);
    if (v && v.statut === 'En service' && dp != null && dp < 0) out.push({p:'P1', cat:'Conducteur', did, vid:vv[0], agence:d.agence, titre:`Permis expiré depuis le ${fd(d.finPermis)}`, detail:`${tag} · affecté à ${v.immat}. Ne prend pas le volant tant que le chef de parc n'a pas réglé la situation.`, draft:true});
    else if (dp != null && dp >= 0 && dp < 30) out.push({p:'P2', cat:'Conducteur', did, agence:d.agence, titre:`Permis : fin le ${fd(d.finPermis)} (dans ${dp} j)`, detail:`${tag}. Renouvellement à lancer sous 7 jours.`, draft:true});
    if (v && !permisOk(d.permis, v.type)) out.push({p:'P1', cat:'Conducteur', did, vid:vv[0], agence:d.agence, titre:`Permis ${d.permis} non adapté au ${v.type}`, detail:`${tag} · ${v.immat}. Camion 7,5 t : permis C ; VP et VUL : permis B.`, draft:true});
    if (v && d.statut === 'Congé') out.push({p:'P3', cat:'Conducteur', did, vid:vv[0], agence:d.agence, titre:'Conducteur en congé avec un véhicule affecté', detail:`${tag} · ${v.immat}. Réaffectation à proposer au chef d'agence.`});
  }
  const order = {P1:0,P2:1,P3:2};
  return out.sort((a, b) => order[a.p] - order[b.p] || a.agence.localeCompare(b.agence));
}
function permisOk(cat, type) { if (!cat) return false; return type === 'Camion 7,5 t' ? cat === 'C' : (cat === 'B' || cat === 'C'); }

// ---------- Rendering ----------
function view() { const h = location.hash.slice(1); return ['tableau-de-bord','vehicules','conducteurs','alertes'].includes(h) ? h : 'tableau-de-bord'; }
function render() {
  const v = view();
  document.querySelectorAll('.side a').forEach((a) => a.classList.toggle('on', a.dataset.v === v));
  const al = computeAlerts(); const p1 = al.filter((a) => a.p === 'P1').length;
  const b = $('#nb-p1'); b.hidden = !p1; b.textContent = p1;
  const m = $('#main');
  const loaded = S.ready.veh && S.ready.drv;
  let banner = '';
  if (S.error) banner = `<div class="banner err">${esc(S.error)}</div>`;
  
  else if (!loaded) banner = '<div class="banner">Chargement des données…</div>';
  if (!S.writable) banner += '<div class="banner">Lecture seule : vous n\'avez pas le droit de modifier le parc.</div>';
  m.innerHTML = banner + (v === 'vehicules' ? vVehicules() : v === 'conducteurs' ? vConducteurs() : v === 'alertes' ? vAlertes(al) : vDashboard(al));
  bind();
}
function pillStatut(s) { return `<span class="pill ${s === 'Immobilisé' ? 'st-imm' : s === 'En service' || s === 'Actif' ? 'ok' : 'P3'}">${esc(s)}</span>`; }

function vDashboard(al) {
  const V = Object.values(S.veh), D = Object.values(S.drv);
  const c = (p) => al.filter((a) => a.p === p).length;
  const imm = V.filter((v) => v.statut === 'Immobilisé').length;
  const nonAff = V.filter((v) => !v.conducteurId).length;
  let exces = 0;
  V.forEach((v) => { const r = REF[v.type], k = +v.kmMois, cc = +v.carbMois; if (v.statut === 'En service' && k > 0 && r && cc / k * 100 > r * 1.25) exces += cc - r * k / 100; });
  const byAg = AGENCES.map((ag) => ({ag, n: V.filter((v) => v.agence === ag).length, p1: al.filter((a) => a.agence === ag && a.p === 'P1').length, p2: al.filter((a) => a.agence === ag && a.p === 'P2').length}));
  const lastDec = S.dec.slice(0, 5);
  return `<div class="top"><div><span class="eyebrow">Pilotage du parc</span><h1>Ce qui demande une décision aujourd'hui</h1><p class="muted">Situation au ${today().toLocaleDateString('fr-FR')} · données de référence du 16/11/2026</p></div>
  <div class="toolbar"><a class="btn pri" href="#alertes" style="text-decoration:none">Traiter les priorités</a></div></div>
  <div class="tiles">
    <div class="card"><div class="muted small">Véhicules</div><div class="num">${V.length}</div><div class="small muted">${V.length - imm} en service · ${imm} immobilisé(s)</div></div>

// ---------- Interactions ----------
function bind() {
  document.querySelectorAll('[data-act]').forEach((el) => el.onclick = (e) => { e.stopPropagation(); act(el.dataset.act, el.dataset.id, el.dataset.motif); });
  for (const k of ['veh','drv']) {
    const q = $(`#${k}-q`), a = $(`#${k}-ag`);
    if (q) q.oninput = () => { S[k + 'Q'] = q.value; render(); const n = $(`#${k}-q`); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
    if (a) a.onchange = () => { S[k + 'Ag'] = a.value; render(); };
  }
  const p = $('#al-p'), ag = $('#al-ag');
  if (p) p.onchange = () => { S.alP = p.value; render(); };
  if (ag) ag.onchange = () => { S.alAg = ag.value; render(); };
}
function act(a, id, motif) {
  if (a === 'edit-v') return vehForm(id);
  if (a === 'new-v') return vehForm(null);
  if (a === 'edit-d') return drvForm(id);
  if (a === 'new-d') return drvForm(null);
  if (a === 'immob') return immobDialog(id, motif);
  if (a === 'draft') return draftDialog(id, motif);
  if (a === 'tel') { S.showTel[id] = !S.showTel[id]; return render(); }
}
function modal(html) { $('#modal').innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; $('#modal .modal-bg').onclick = (e) => { if (e.target.classList.contains('modal-bg')) closeModal(); }; }
function closeModal() { $('#modal').innerHTML = ''; }
function opt(list, cur) { return list.map((o) => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join(''); }

function vehForm(id) {
  const v = id ? S.veh[id] : {immat:'', type:'VP pré-vendeur', agence:'Casablanca', conducteurId:'', km:0, kmVidange:0, finVT:'', finAssurance:'', kmMois:0, carbMois:0, statut:'En service'};
  const drvOpts = ['<option value="">— Non affecté —</option>'].concat(Object.entries(S.drv).sort((a, b) => a[1].nom.localeCompare(b[1].nom)).map(([did, d]) => { const o = vehOf(did); const busy = o && o[0] !== id; return `<option value="${did}" ${v.conducteurId === did ? 'selected' : ''}>${esc(d.nom)} · ${esc(d.agence)} · permis ${esc(d.permis)}${busy ? ' (déjà affecté à ' + esc(o[1].immat) + ')' : ''}</option>`; })).join('');
  modal(`<h2>${id ? 'Véhicule ' + esc(v.immat) : 'Nouveau véhicule'}</h2>
  <form class="form" id="f">
    <label>Immatriculation<input name="immat" required value="${esc(v.immat)}"></label>
    <label>Type<select name="type">${opt(TYPES, v.type)}</select></label>
    <label>Agence<select name="agence">${opt(AGENCES, v.agence)}</select></label>

    <label>Carburant du mois (L)<input type="number" min="0" name="carbMois" value="${esc(v.carbMois)}"></label>

    <div class="full toolbar" style="justify-content:space-between"><div>${id ? `<button type="button" class="btn danger" id="del" ${S.writable ? '' : 'disabled'}>Supprimer</button>` : ''}</div><div class="toolbar"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn pri" ${S.writable ? '' : 'disabled'}>Enregistrer</button></div></div>
    <p class="full small muted" id="msg"></p>
  </form>`);
  const f = $('#f');
  f.statut.onchange = () => { $('#imm-warn').hidden = !(f.statut.value === 'Immobilisé' && v.statut !== 'Immobilisé'); };
  $('#cancel').onclick = closeModal;
  if (id) $('#del').onclick = () => confirmDialog(`Supprimer le véhicule ${v.immat} ?`, 'Cette action est définitive.', async () => { await write(() => S.db.doc('vehicules/' + id).delete()); closeModal(); });
  f.onsubmit = async (e) => {
    e.preventDefault();
    const fd2 = Object.fromEntries(new FormData(f));
    const data = {...fd2, km:+fd2.km, kmVidange:+fd2.kmVidange, kmMois:+fd2.kmMois, carbMois:+fd2.carbMois, immat:fd2.immat.trim().toUpperCase()};
    const dupe = Object.entries(S.veh).find(([k, x]) => x.immat === data.immat && k !== id);
    if (dupe) { $('#msg').textContent = `Cette immatriculation existe déjà (${dupe[0]}).`; return; }
    const nid = id || nextId('V', S.veh);
    const wantImm = data.statut === 'Immobilisé' && (!id || v.statut !== 'Immobilisé');
    if (wantImm) data.statut = id ? v.statut : 'En service';
    if (data.conducteurId) { const o = vehOf(data.conducteurId); if (o && o[0] !== nid) await write(() => S.db.doc('vehicules/' + o[0]).update({conducteurId:''})); }
    const ok = await write(() => S.db.doc('vehicules/' + nid).set(data));
    if (!ok) return;
    if (wantImm) immobDialog(nid, 'Changement de statut demandé dans la fiche véhicule'); else closeModal();

function drvForm(id) {

  const cur = id ? vehOf(id) : null;
  const vOpts = ['<option value="">— Aucun —</option>'].concat(Object.entries(S.veh).sort((a, b) => a[1].immat.localeCompare(b[1].immat)).map(([vid, v]) => `<option value="${vid}" ${cur && cur[0] === vid ? 'selected' : ''}>${esc(v.immat)} · ${esc(v.type)} · ${esc(v.agence)}${v.conducteurId && v.conducteurId !== id ? ' (conduit par ' + esc(S.drv[v.conducteurId]?.nom || '?') + ')' : ''}</option>`)).join('');

    <label>Véhicule affecté<select name="vehicule">${vOpts}</select></label>
    <div class="full toolbar" style="justify-content:space-between"><div>${id ? `<button type="button" class="btn danger" id="del" ${S.writable ? '' : 'disabled'}>Supprimer</button>` : ''}</div><div class="toolbar"><button type="button" class="btn" id="cancel">Annuler</button><button class="btn pri" ${S.writable ? '' : 'disabled'}>Enregistrer</button></div></div>
  </form>`);
  const f = $('#f');
  $('#cancel').onclick = closeModal;
  if (id) $('#del').onclick = () => confirmDialog(`Supprimer ${d.nom} ?`, 'Son véhicule deviendra « non affecté ».', async () => { if (cur) await write(() => S.db.doc('vehicules/' + cur[0]).update({conducteurId:''})); await write(() => S.db.doc('conducteurs/' + id).delete()); closeModal(); });
  f.onsubmit = async (e) => {
    e.preventDefault();
    const x = Object.fromEntries(new FormData(f)); const vsel = x.vehicule; delete x.vehicule;
    const nid = id || nextId('C', S.drv);
    if (!(await write(() => S.db.doc('conducteurs/' + nid).set(x)))) return;
    if (cur && cur[0] !== vsel) await write(() => S.db.doc('vehicules/' + cur[0]).update({conducteurId:''}));

function immobDialog(vid, motif) {
  const v = S.veh[vid]; if (!v) return;
  modal(`<h2>Immobiliser ${esc(v.immat)} ?</h2>
  <div class="warnbox"><b>Décision humaine obligatoire.</b> L'outil propose ; seul le chef de parc décide l'immobilisation.</div>

  <form class="form" id="f">

    <label class="full">Commentaire (facultatif)<input name="note"></label>

    <div class="full toolbar" style="justify-content:flex-end"><button type="button" class="btn" id="cancel">Ne pas immobiliser</button><button class="btn dark" ${S.writable ? '' : 'disabled'}>Valider l'immobilisation</button></div>

}
function draftDialog(did, motif) {
  const d = S.drv[did]; if (!d) return;
  const txt = `Bonjour ${d.nom},\n\nLe service flotte a relevé le point suivant : ${motif.replace(/<[^>]+>/g, '')}.\nMerci de passer voir votre chef de parc pour régulariser la situation.\n\nService flotte — Kaïna Distribution`;
  modal(`<h2>Brouillon pour ${esc(d.nom)}</h2>
  <p class="muted small">Brouillon seulement : aucun message n'est envoyé par l'outil. Le chef de parc relit, valide et l'envoie lui-même.</p>
  <textarea id="t" rows="8" style="width:100%">${esc(txt)}</textarea>
  <div class="toolbar" style="justify-content:flex-end"><span class="small muted" id="cp"></span><button class="btn" id="cancel">Fermer</button><button class="btn pri" id="copy">Copier le texte</button></div>`);
  $('#cancel').onclick = closeModal;
  $('#copy').onclick = async () => { try { await navigator.clipboard.writeText($('#t').value); $('#cp').textContent = 'Texte copié.'; } catch { $('#t').select(); $('#cp').textContent = 'Sélectionnez le texte et copiez-le (Ctrl+C).'; } };
}
function confirmDialog(title, text, onYes) {
  modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="toolbar" style="justify-content:flex-end"><button class="btn" id="no">Annuler</button><button class="btn danger" id="yes">Confirmer</button></div>`);
  $('#no').onclick = closeModal; $('#yes').onclick = onYes;
}
function nextId(p, obj) { let n = Object.keys(obj).filter((k) => k.startsWith(p)).map((k) => parseInt(k.slice(1), 10) || 0).reduce((a, b) => Math.max(a, b), 0) + 1; return p + String(n).padStart(2, '0'); }
async function write(fn) {
  if (!S.db) { S.error = 'Enregistrement indisponible : modification non sauvegardée.'; render(); return false; }
  try { await fn(); return true; }
  catch (e) {
    if (e && e.code === 'invalid_argument') { S.writable = false; S.error = 'Modification refusée : vous n\'avez pas le droit de modifier le parc.'; }
    else if (e && e.code === 'quota_exceeded') S.error = 'Capacité de stockage atteinte : supprimez des éléments avant d\'en ajouter.';
    else S.error = 'Échec de l\'enregistrement, réessayez.';
    render(); return false;
  }
}
